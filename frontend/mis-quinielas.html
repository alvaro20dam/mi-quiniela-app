<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mi historial de quinielas — Quinielas La Liga." />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Mi Quiniela — Historial</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/design-system.css?v=4" />
  <link rel="stylesheet" href="css/components.css?v=4" />
  <link rel="stylesheet" href="css/responsive.css?v=4" />


  <style>
    .history-grid {
      display: grid;
      gap: var(--space-4);
      margin-top: var(--space-6);
      align-items: flex-start;
    }
    @media (min-width: 768px) {
      .history-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body class="bg-gradient-main">

  <!-- ── HEADER ──────────────────────────────────────────── -->
  <header class="app-header" role="banner">
    <div class="container header-inner">
      <a href="dashboard.html" class="header-logo" aria-label="Quinielas La Liga — Inicio">
        <div class="logo-icon" aria-hidden="true">⚽</div>
        <span class="logo-text display-title">Quinielas <span>LaLiga</span></span>
      </a>

      <!-- Nav Desktop -->
      <nav class="header-nav" aria-label="Navegación principal">
        <a href="dashboard.html" class="nav-link">
          <span aria-hidden="true">🎯</span> Mi Quiniela
        </a>
        <a href="mis-quinielas.html" class="nav-link active" aria-current="page">
          <span aria-hidden="true">📋</span> Mis Quinielas
        </a>
        <a href="ranking.html" class="nav-link">
          <span aria-hidden="true">🏆</span> Clasificación
        </a>
      </nav>

      <!-- User área -->
      <div class="header-user">
        <!-- Profile Chip -->
        <div class="profile-chip" id="profile-chip">
          <div class="profile-chip-avatar-wrap">
            <div id="user-avatar" class="user-avatar profile-chip-avatar" title="Mi perfil">?</div>
            <span class="profile-chip-online" aria-hidden="true"></span>
          </div>
          <div class="profile-chip-info">
            <span id="user-name" class="profile-chip-name">Cargando...</span>
            <span id="sub-badge" class="profile-chip-badge">Sin suscripción</span>
          </div>
        </div>
        <button id="btn-logout" class="btn btn-ghost btn-sm" aria-label="Cerrar sesión" style="display:none">Salir</button>
      </div>
    </div>
  </header>

  <!-- ── MAIN CONTENT ─────────────────────────────────────── -->
  <main class="page-content container" id="main-content">
    <div class="jornada-header animate-fadeInUp">
      <h2>Mi Historial de Quinielas</h2>
      <p style="color:var(--color-text-muted)">Consulta tus pronósticos y puntos obtenidos.</p>
    </div>

    <!-- Filtros o Resumen (opcional) -->
    <div class="glass-card animate-fadeInUp" style="animation-delay:0.1s; display:flex; gap:1rem; align-items:center;">
      <div style="font-size:2rem">📈</div>
      <div>
        <div style="font-size:var(--text-xs); color:var(--color-text-muted)">Total de Puntos Históricos</div>
        <div id="total-puntos-badge" style="font-size:var(--text-2xl); font-weight:700; color:var(--color-gold)">0 pts</div>
      </div>
    </div>

    <div id="history-grid" class="history-grid">
      <!-- Quinielas se inyectan aquí -->
    </div>
  </main>

  <!-- ── BOTTOM NAVIGATION (Mobile) ────────────────────────── -->
  <nav class="bottom-nav" aria-label="Navegación principal móvil">
    <div class="bottom-nav-inner">
      <a href="dashboard.html" class="bottom-nav-item" id="bnav-dashboard">
        <span class="bottom-nav-icon" aria-hidden="true">🎯</span>
        <span>Quiniela</span>
      </a>
      <a href="mis-quinielas.html" class="bottom-nav-item active" aria-current="page" id="bnav-mis">
        <span class="bottom-nav-icon" aria-hidden="true">📋</span>
        <span>Mis Q.</span>
      </a>
      <a href="ranking.html" class="bottom-nav-item" id="bnav-ranking">
        <span class="bottom-nav-icon" aria-hidden="true">🏆</span>
        <span>Ranking</span>
      </a>
      <button class="bottom-nav-item" id="bnav-logout" aria-label="Cerrar sesión" onclick="document.getElementById('btn-logout').click()">
        <span class="bottom-nav-icon" aria-hidden="true">🚪</span>
        <span>Salir</span>
      </button>
    </div>
  </nav>

  <!-- Toast -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts -->
  <script src="js/api.js?v=5"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/mis-quinielas.js?v=5"></script>
</body>
</html>
