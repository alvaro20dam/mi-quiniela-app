<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Restablecer Contraseña — Quinielas La Liga</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    .bg-decoration {
      position: fixed;
      pointer-events: none;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }
    .bg-decoration::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(230,57,70,0.12) 0%, transparent 70%);
      border-radius: 50%;
    }
    .bg-decoration::after {
      content: '';
      position: absolute;
      bottom: -10%;
      right: -5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(244,167,38,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .auth-container { position: relative; z-index: 1; }
    
    .password-wrapper {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      font-size: var(--text-lg);
      padding: var(--space-1);
      line-height: 1;
      transition: color var(--transition-fast);
    }
    .password-toggle:hover { color: var(--color-text-primary); }
    .password-wrapper .form-input { padding-right: 3rem; }
  </style>
</head>
<body>
  <div class="bg-decoration" aria-hidden="true"></div>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon-lg" aria-hidden="true">🔐</div>
        <h1 class="auth-title display-title">Restablecer <span style="color:var(--color-accent)">Contraseña</span></h1>
        <p class="auth-subtitle">Ingresa tu nueva contraseña para acceder a tu cuenta.</p>
      </div>

      <form id="reset-form" class="auth-form" novalidate>
        <div id="reset-alert" aria-live="polite" aria-atomic="true"></div>

        <div class="form-group">
          <label class="form-label" for="new-password">
            Nueva Contraseña <span class="required">*</span>
          </label>
          <div class="password-wrapper">
            <input
              id="new-password"
              name="password"
              type="password"
              class="form-input"
              placeholder="Mínimo 8 caracteres"
              required
              minlength="8"
            />
            <button
              type="button"
              class="password-toggle"
              data-toggle-password="new-password"
            >👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-password-confirm">
            Confirmar Contraseña <span class="required">*</span>
          </label>
          <div class="password-wrapper">
            <input
              id="new-password-confirm"
              name="password_confirm"
              type="password"
              class="form-input"
              placeholder="Repite tu contraseña"
              required
            />
            <button
              type="button"
              class="password-toggle"
              data-toggle-password="new-password-confirm"
            >👁️</button>
          </div>
        </div>

        <button id="btn-reset" type="submit" class="btn btn-primary btn-full btn-lg">
          <span class="btn-text">Actualizar Contraseña</span>
        </button>
        
        <div style="text-align: center; margin-top: var(--space-4);">
          <a href="index.html" style="font-size: var(--text-sm); color: var(--color-text-secondary); text-decoration: none;">Volver al inicio de sesión</a>
        </div>
      </form>
    </div>
  </main>

  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
